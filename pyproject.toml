[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context_bandits"
version = "0.1.0"
description = "Linear Contextual Bandits for MovieLens Recommendation"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
include = ["bandits", "bandit_environment", "data_loading", "features", "experiments"]

[tool.uv.workspace]
members = [
    "venv",
]
